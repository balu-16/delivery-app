# Development services only. Ports bind to loopback and credentials are local defaults.
name: delivery
services:
  postgres:
    image: postgis/postgis:16-3.6-alpine@sha256:d5955943c6e633219d80bd1d7fd986a097fdd44f3979c53d4839d62647bba478
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: delivery
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d delivery']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.12-alpine3.21@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3,ses
      PERSISTENCE: '1'
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json,urllib.request; s=json.load(urllib.request.urlopen('http://localhost:4566/_localstack/health', timeout=5))['services']; assert all(s.get(k) in ('available', 'running') for k in ('s3', 'ses'))"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  redis_data:
  localstack_data:
  mailpit_data:
